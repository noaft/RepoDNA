[package]
name = "RepoDNA"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
